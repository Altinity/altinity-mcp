{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- /*
The scrape scheme must match what the MCP port actually speaks: when
config.server.tls.enabled is true the same port serves HTTPS, and a plain
HTTP scrape would fail. Follow the server setting unless the operator pins
metrics.serviceMonitor.scheme explicitly.
*/}}
{{- $scheme := .Values.metrics.serviceMonitor.scheme | default (ternary "https" "http" (.Values.config.server.tls.enabled | default false)) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "altinity-mcp.fullname" . }}
  labels:
    {{- include "altinity-mcp.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "altinity-mcp.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      scheme: {{ $scheme }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- with .Values.metrics.serviceMonitor.tlsConfig }}
      tlsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
